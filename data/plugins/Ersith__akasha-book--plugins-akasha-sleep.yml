url: https://github.com/Ersith/akasha-book/tree/main/plugins/akasha-sleep
name: Ersith/akasha-book#akasha-sleep
category: memory
description:
  en: 'Schedules Akasha sleep distillation on idle or timer, and injects a wake note for new sessions plus a per-turn memory pulse; the optional idle-resume behaviour is off by default. Companions: Hindsight (repo memory), OpenViking (user memory), and the host's session search (see repo README).'
  zh: '空闲或定时触发阿卡夏睡眠蒸馏，并为新会话注入唤醒条、每回合注入库脉搏；可选的空闲续行默认关闭。（配套：Hindsight 仓库记忆 / OpenViking 用户记忆 / 宿主会话检索；见仓库 README）'
